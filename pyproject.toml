[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "revdoku"
version = "6.0.0"
description = "Revdoku API client for Python: publish docs sites for people and AI agents, with a support mailbox and file storage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Revdoku", email = "support@revdoku.com" }]
requires-python = ">=3.10"
keywords = ["revdoku", "docs", "documentation", "api-docs", "docs-site", "ai-agents", "mcp", "llms-txt", "support-email", "mailbox", "file-storage", "api", "sdk"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = [
  "urllib3 (>=2.7.0,<3.0.0)",
  "python-dateutil (>=2.8.2)",
  "pydantic (>=2.11)",
  "typing-extensions (>=4.7.1)",
]

[project.urls]
Homepage = "https://revdoku.com"
Documentation = "https://docs.revdoku.com/sdks/python"
Repository = "https://github.com/revdoku/revdoku-python"
Issues = "https://github.com/revdoku/revdoku-python/issues"

[tool.setuptools.packages.find]
include = ["revdoku", "revdoku.*"]

[tool.setuptools.package-data]
revdoku = ["py.typed", "REFERENCE.md"]

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "revdoku",
  #"test",  # auto-generated tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
extra_checks = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "revdoku.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
